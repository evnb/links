name: Build & Deploy Shortlinks

on:
  push:
    branches: [main]
    paths:
      - links.yaml
      - .github/workflows/build.yml
      - generate.py

  # schedule:
    # - cron: '0 0 * * 0'  # Rebuild weekly to refresh OG metadata

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install pyyaml requests beautifulsoup4 lxml

      - name: Generate redirect pages
        run: python generate.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5